<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTTP 상태 사전 & 퀴즈</title>
    <!-- Pretendard 폰트 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    
    <style>
        /* --- 기본 설정 --- */
        html { scroll-behavior: smooth; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; overflow-x: hidden; background-color: #000; }

        /* --- 1. 인트로 섹션 --- */
        .intro-section {
            height: 100vh; background-color: #000000; color: #ffffff;
            display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative;
        }
        .main-title { font-size: 5rem; font-weight: 700; letter-spacing: -2px; margin-bottom: 20px; }
        .sub-title { font-size: 1.5rem; font-weight: 100; color: #cccccc; letter-spacing: 1px; }
        .scroll-down {
            position: absolute; bottom: 40px; display: flex; flex-direction: column; align-items: center;
            font-size: 0.9rem; font-weight: 300; color: #666; text-decoration: none; cursor: pointer;
            animation: bounce 2s infinite ease-in-out; transition: color 0.3s;
        }
        .scroll-down:hover { color: #fff; }
        .scroll-down svg { margin-top: 10px; width: 24px; height: 24px; fill: currentColor; }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-15px); }
            60% { transform: translateY(-7px); }
        }

        /* --- 2. 메인 애플리케이션 섹션 --- */
        .main-section {
            height: 100vh; background-color: #ffffff; display: flex; flex-direction: column;
            justify-content: center; align-items: center; position: relative;
        }
        .bg-pattern {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(to right, rgba(0,0,0,0.02) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(0,0,0,0.02) 1px, transparent 1px);
            background-size: 40px 40px; z-index: 0;
        }
        .content-container {
            position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center;
            width: 100%; max-width: 1200px; padding: 40px; transition: all 0.6s ease;
        }
        .main-section.detail-mode .content-container { max-width: 95%; flex-direction: row; align-items: flex-start; justify-content: flex-start; }

        .category-nav { display: flex; flex-direction: row; gap: 12px; margin-bottom: 50px; transition: all 0.6s ease; }
        .nav-item { position: relative; display: flex; flex-direction: column; }
        .cat-btn {
            background: transparent; border: 1px solid #e0e0e0; padding: 8px 20px; border-radius: 30px;
            font-family: inherit; font-size: 1rem; font-weight: 500; color: #777; cursor: pointer; transition: all 0.4s ease; width: 100%;
        }
        .cat-btn:hover { border-color: #111; color: #111; }
        .cat-btn.active { background: #111; border-color: #111; color: #fff; }

        .main-section.detail-mode .category-nav { flex-direction: column; width: 220px; margin-bottom: 0; margin-right: 40px; margin-top: 20px; flex-shrink: 0; }
        .main-section.detail-mode .nav-item { opacity: 0; transform: translateX(-30px); animation: slideInBtn 0.6s forwards; width: 100%; }
        .main-section.detail-mode .nav-item:nth-child(1) { animation-delay: 0.10s; }
        .main-section.detail-mode .nav-item:nth-child(2) { animation-delay: 0.15s; }
        .main-section.detail-mode .nav-item:nth-child(3) { animation-delay: 0.20s; }
        .main-section.detail-mode .nav-item:nth-child(4) { animation-delay: 0.25s; }
        .main-section.detail-mode .nav-item:nth-child(5) { animation-delay: 0.30s; }
        .main-section.detail-mode .nav-item:nth-child(6) { animation-delay: 0.35s; }
        .main-section.detail-mode .cat-btn { border-radius: 8px; text-align: left; padding: 15px 20px; }
        @keyframes slideInBtn { to { opacity: 1; transform: translateX(0); } }

        .sub-menu { display: none; flex-direction: column; gap: 4px; margin-top: 8px; padding-left: 10px; }
        .main-section:not(.detail-mode) .sub-menu { display: none !important; }
        .main-section.detail-mode .cat-btn.active + .sub-menu { display: flex; animation: fadeInSub 0.4s ease; }
        .sub-btn {
            background: transparent; border: none; text-align: left; padding: 10px 14px;
            font-size: 0.95rem; color: #888; border-radius: 6px; cursor: pointer; transition: all 0.2s ease; font-family: inherit;
        }
        .sub-btn:hover { background: #f4f4f4; color: #111; }
        .sub-btn.selected { background: #e0e0e0; color: #111; font-weight: 700; }
        @keyframes fadeInSub { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .card-wrapper { display: flex; align-items: center; justify-content: center; gap: 40px; width: 100%; transition: all 0.6s ease; }
        .main-section.detail-mode .card-wrapper { flex: 1; width: 100%; }

        .nav-arrow { background: none; border: none; font-size: 2rem; color: #ccc; cursor: pointer; padding: 20px; border-radius: 50%; transition: all 0.3s ease; }
        .nav-arrow:hover { color: #111; background: rgba(0,0,0,0.03); transform: scale(1.1); }
        .main-section.detail-mode .nav-arrow { display: none; }
        .progress-container { margin-top: 50px; width: 240px; height: 3px; background: #f0f0f0; border-radius: 3px; overflow: hidden; transition: opacity 0.4s ease; }
        .progress-bar { height: 100%; width: 0%; background: #222; transition: width 0.05s linear; }
        .main-section.detail-mode .progress-container { display: none; }

        .code-card {
            width: 320px; height: 320px; background: #ffffff; border-radius: 24px;
            border: 1px solid rgba(0, 0, 0, 0.04); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
            position: relative; cursor: pointer; transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); overflow: hidden;
        }
        .code-card[data-category="1xx"]:hover { box-shadow: 0 30px 60px rgba(155, 89, 182, 0.2); }
        .code-card[data-category="2xx"]:hover { box-shadow: 0 30px 60px rgba(46, 204, 113, 0.2); }
        .code-card[data-category="3xx"]:hover { box-shadow: 0 30px 60px rgba(52, 152, 219, 0.2); }
        .code-card[data-category="4xx"]:hover { box-shadow: 0 30px 60px rgba(230, 126, 34, 0.2); }
        .code-card[data-category="5xx"]:hover { box-shadow: 0 30px 60px rgba(231, 76, 60, 0.2); }
        .main-section:not(.detail-mode) .code-card:hover { transform: scale(1.08) translateY(-10px); }

        .main-section.detail-mode .code-card { width: 100%; height: 85vh; transform: none !important; cursor: default; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08); border-color: #eee; }

        .code-number { font-size: 7rem; font-weight: 800; color: #111; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); transition: all 0.6s ease; }
        .main-section:not(.detail-mode) .code-card:hover .code-number { top: 32%; font-size: 4.5rem; }
        .code-details { position: absolute; bottom: 25%; left: 50%; transform: translate(-50%, 20px); text-align: center; width: 85%; opacity: 0; transition: all 0.6s ease; }
        .main-section:not(.detail-mode) .code-card:hover .code-details { opacity: 1; transform: translate(-50%, 0); }
        .code-en { font-size: 1.5rem; font-weight: 700; color: #222; margin-bottom: 8px; }
        .code-ko { font-size: 1rem; font-weight: 400; color: #666; word-break: keep-all; line-height: 1.4; }
        .click-hint { position: absolute; bottom: 25px; left: 50%; transform: translate(-50%, 10px); font-size: 0.9rem; color: #888; font-weight: 500; opacity: 0; transition: all 0.4s ease; }
        .main-section:not(.detail-mode) .code-card:hover .click-hint { opacity: 1; transform: translate(-50%, 0); }

        .main-section.detail-mode .code-number { top: 40px; left: 40px; transform: none; font-size: 3.5rem; }
        .main-section.detail-mode .code-details { top: 45px; left: 160px; bottom: auto; transform: none; opacity: 1; text-align: left; width: auto; }
        .main-section.detail-mode .click-hint { display: none; }

        .close-btn { position: absolute; top: 30px; right: 30px; background: #f4f4f4; border: none; padding: 10px 20px; border-radius: 20px; font-family: inherit; font-weight: 500; cursor: pointer; opacity: 0; visibility: hidden; transition: all 0.3s ease; z-index: 10; }
        .close-btn:hover { background: #e0e0e0; }
        .main-section.detail-mode .close-btn { opacity: 1; visibility: visible; }
        .fade { transition: opacity 0.3s ease, transform 0.3s ease; }
        .fade-out { opacity: 0; transform: scale(0.95); }

        /* 애니메이션 공통 아트 스타일 */
        .extended-content {
            position: absolute; top: 130px; left: 40px; right: 40px; bottom: 40px; opacity: 0; visibility: hidden;
            transform: translateY(20px); transition: all 0.6s ease; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 50px;
        }
        .main-section.detail-mode .extended-content { opacity: 1; visibility: visible; transform: translateY(0); }
        .short-text { font-size: 1.3rem; font-weight: 600; color: #111; text-align: center; }
        .anim-stage { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 450px; height: 120px; position: relative; }
        
        /* 라이트 모드 도형 기본 */
        .art-laptop { width: 52px; height: 34px; border: 2.5px solid #111; border-radius: 4px; position: relative; flex-shrink: 0; }
        .art-laptop::after { content: ''; position: absolute; bottom: -10px; left: -14px; width: 75px; height: 4px; background: #111; border-radius: 2px; }
        .art-server { width: 38px; height: 65px; border: 2.5px solid #111; border-radius: 4px; position: relative; flex-shrink: 0; }
        .art-server::before { content: ''; position: absolute; top: 14px; left: 0; width: 100%; height: 2px; background: #111; box-shadow: 0 16px 0 #111, 0 32px 0 #111; }
        .art-track { flex: 1; height: 80px; position: relative; margin: 0 40px; }
        .art-arrow { position: absolute; height: 2.5px; background: #111; width: 40px; }
        .art-arrow.right::after { content: ''; position: absolute; right: -2px; top: -5px; border-left: 9px solid #111; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
        .art-arrow.left::after { content: ''; position: absolute; left: -2px; top: -5px; border-right: 9px solid #111; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }

        /* 애니메이션 키프레임 */
        .arr-100 { top: 50%; animation: kf-100 2.5s infinite; }
        @keyframes kf-100 { 0% { left: 0%; opacity: 0; } 20% { left: 35%; opacity: 1; } 40% { left: 25%; opacity: 1; } 60% { left: 60%; opacity: 1; } 80% { left: 50%; opacity: 1; } 100% { left: 100%; opacity: 0; } }
        .arr-200-req { top: 30%; animation: kf-200-req 2.5s infinite; }
        .arr-200-res { top: 70%; animation: kf-200-res 2.5s infinite; }
        @keyframes kf-200-req { 0% { left: 0%; opacity: 1; } 40%, 100% { left: 100%; opacity: 0; } }
        @keyframes kf-200-res { 0%, 50% { right: 0%; opacity: 0; } 51% { right: 0%; opacity: 1; } 90%, 100% { right: 100%; opacity: 0; } }
        .arr-201-req { top: 30%; animation: kf-200-req 3.5s infinite; }
        .arr-201-res { top: 70%; animation: kf-200-res 3.5s infinite; }
        .art-new-file { position: absolute; right: -30px; top: -20px; width: 18px; height: 24px; border: 2px solid #111; background: #fff; animation: kf-201-file 3.5s infinite; z-index: 2; }
        .art-new-file::after { content: '+'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-weight: 900; font-size: 16px; color: #111; }
        @keyframes kf-201-file { 0%, 35% { opacity: 0; transform: translateY(10px); } 45%, 90% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } }
        .arr-301 { top: 50%; animation: kf-301 3s infinite; }
        .art-server-2 { position: absolute; right: -50px; top: -50px; opacity: 0.4; width: 28px; height: 48px; border: 2.5px dashed #111; border-radius: 4px; }
        @keyframes kf-301 { 0% { left: 0%; top: 50%; opacity: 1; transform: rotate(0deg); } 40% { left: 85%; top: 50%; transform: rotate(0deg); opacity: 1;} 45% { left: 85%; top: 50%; transform: rotate(-40deg); opacity: 1;} 70% { left: 120%; top: -10%; opacity: 0; transform: rotate(-40deg); } 100% { opacity: 0; } }
        .arr-304-req { top: 30%; animation: kf-304-req 2s infinite; }
        .arr-304-res { top: 70%; animation: kf-304-res 2s infinite; }
        .art-cache { position: absolute; left: 10px; top: -25px; padding: 2px 6px; border: 2px dotted #111; border-radius: 4px; font-size: 11px; font-weight: 800; animation: kf-304-cache 2s infinite; background: #fff; color: #111; }
        @keyframes kf-304-req { 0% { left: 0%; opacity: 1; } 20%, 100% { left: 100%; opacity: 0; } }
        @keyframes kf-304-res { 0%, 20% { right: 0%; opacity: 0; } 21% { right: 0%; opacity: 1; } 40%, 100% { right: 100%; opacity: 0; } }
        @keyframes kf-304-cache { 0%, 40% { opacity: 0; } 50%, 90% { opacity: 1; } 100% { opacity: 0; } }
        .arr-400 { top: 50%; animation: kf-400 2.5s infinite; }
        .art-x-mark { position: absolute; left: 50%; top: 25%; font-size: 32px; font-weight: 900; color: #111; animation: kf-400-x 2.5s infinite; opacity: 0; transform: translateX(-50%);}
        @keyframes kf-400 { 0% { left: 0%; opacity: 1; transform: rotate(0deg); } 30% { left: 45%; opacity: 1; transform: rotate(15deg); } 40% { left: 50%; opacity: 0; transform: rotate(-25deg) translateY(10px); } 100% { opacity: 0; } }
        @keyframes kf-400-x { 0%, 35% { opacity: 0; transform: translateX(-50%) scale(0.5); } 45%, 80% { opacity: 1; transform: translateX(-50%) scale(1); } 100% { opacity: 0; } }
        .arr-404-req { top: 30%; animation: kf-200-req 3s infinite; }
        .arr-404-res { top: 70%; animation: kf-200-res 3s infinite; }
        .art-question { position: absolute; right: -15px; top: -35px; font-size: 30px; font-weight: 900; animation: kf-404-q 3s infinite; opacity: 0; color: #111; }
        @keyframes kf-404-q { 0%, 35% { opacity: 0; transform: translateY(10px); } 45%, 80% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } }
        .arr-500-req { top: 50%; animation: kf-500-req 3s infinite; }
        @keyframes kf-500-req { 0% { left: 0%; opacity: 1; } 30%, 100% { left: 100%; opacity: 0; } }
        .art-server-500 { animation: kf-500-shake 3s infinite; border-color: #e74c3c !important; }
        .art-server-500::before { background: #e74c3c !important; box-shadow: 0 16px 0 #e74c3c, 0 32px 0 #e74c3c !important; }
        @keyframes kf-500-shake { 0%, 30%, 40%, 100% { transform: translate(0, 0); } 32%, 36% { transform: translate(-5px, 0) rotate(-6deg); } 34%, 38% { transform: translate(5px, 0) rotate(6deg); } }
        .art-fire { position: absolute; right: 0px; top: -30px; font-size: 26px; font-weight: 900; color: #e74c3c; animation: kf-500-fire 3s infinite; opacity: 0; }
        @keyframes kf-500-fire { 0%, 30% { opacity: 0; transform: scale(0.8); } 32%, 80% { opacity: 1; transform: scale(1.2); } 100% { opacity: 0; } }

        /* --- 3. 퀴즈 인트로 섹션 --- */
        .quiz-intro-section {
            height: 100vh; background-color: #000000; color: #ffffff;
            display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative;
        }
        .quiz-title { font-size: 3.5rem; font-weight: 700; margin-bottom: 40px; display: flex; align-items: center; letter-spacing: -1px; }
        .bouncing-qm { display: inline-block; margin-left: 8px; color: #ffffff; animation: bounceQm 1.2s ease-in-out infinite; }
        @keyframes bounceQm { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .quiz-start-btn {
            background-color: #ffffff; color: #000000; border: none; padding: 16px 45px;
            font-size: 1.2rem; font-weight: 700; border-radius: 30px; cursor: pointer; transition: all 0.3s ease; font-family: inherit;
        }
        .quiz-start-btn:hover { transform: scale(1.05); box-shadow: 0 10px 20px rgba(255, 255, 255, 0.15); }

        /* --- 4. 퀴즈 실행 전체 화면 (오버레이) --- */
        .quiz-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000000; color: #ffffff; z-index: 9999;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            opacity: 0; visibility: hidden; transition: opacity 0.4s ease; padding: 40px 20px;
        }
        .quiz-overlay.active { opacity: 1; visibility: visible; }

        /* 상단 프로그레스 표기 */
        .quiz-header-index { font-size: 1.8rem; font-weight: 800; letter-spacing: 2px; margin-top: 10px; }

        /* 퀴즈 메인 컨테이너 */
        .quiz-body {
            width: 100%; max-width: 800px; flex: 1; display: flex; flex-direction: column;
            justify-content: flex-start; position: relative; margin-top: 20px;
        }

        /* 단계별 힌트 디자인 */
        .hint-en { font-size: 2.8rem; font-weight: 800; opacity: 0; transform: translateY(-10px); transition: all 0.5s ease; color: #fff; margin-bottom: 12px; text-align: left; }
        .hint-ko { font-size: 1.2rem; font-weight: 400; color: #aaa; opacity: 0; transform: translateY(-10px); transition: all 0.5s ease; margin-bottom: 8px; text-align: left; }
        .hint-long { font-size: 1.4rem; font-weight: 600; color: #fff; opacity: 0; transform: translateY(-10px); transition: all 0.5s ease; margin-bottom: 25px; text-align: left; }
        
        /* 다크모드용 다이어그램 (하얀색 선/문자) */
        .quiz-art-container {
            width: 100%; height: 160px; display: flex; justify-content: center; align-items: center;
            opacity: 0; transform: scale(0.95); transition: all 0.5s ease; margin-top: 10px;
        }
        .quiz-art-container.dark-art .art-laptop { border-color: #fff; }
        .quiz-art-container.dark-art .art-laptop::after { background: #fff; }
        .quiz-art-container.dark-art .art-server { border-color: #fff; }
        .quiz-art-container.dark-art .art-server::before { background: #fff; box-shadow: 0 16px 0 #fff, 0 32px 0 #fff; }
        .quiz-art-container.dark-art .art-arrow { background: #fff; }
        .quiz-art-container.dark-art .art-arrow.right::after { border-left-color: #fff; }
        .quiz-art-container.dark-art .art-arrow.left::after { border-right-color: #fff; }
        .quiz-art-container.dark-art .art-new-file { border-color: #fff; background: #000; }
        .quiz-art-container.dark-art .art-new-file::after { color: #fff; }
        .quiz-art-container.dark-art .art-server-2 { border-color: #fff; }
        .quiz-art-container.dark-art .art-cache { border-color: #fff; background: #000; color: #fff; }
        .quiz-art-container.dark-art .art-x-mark { color: #fff; }
        .quiz-art-container.dark-art .art-question { color: #fff; }

        .hint-show { opacity: 1 !important; transform: translateY(0) scale(1) !important; }

        /* 입력 폼 디자인 */
        .quiz-input-box {
            margin-top: auto; margin-bottom: 30px; display: flex; flex-direction: column; align-items: center; width: 100%;
        }
        .quiz-input-box input {
            background: transparent; border: none; border-bottom: 2px solid #555; width: 280px;
            padding: 12px; font-size: 1.8rem; font-weight: 700; color: #fff; text-align: center;
            outline: none; font-family: inherit; transition: border-color 0.3s;
        }
        .quiz-input-box input:focus { border-bottom-color: #fff; }
        .quiz-input-box input::placeholder { font-size: 1rem; font-weight: 300; color: #555; }

        /* 하단 30초 줄어드는 타임바 */
        .quiz-time-bar-wrapper { position: absolute; bottom: 0; left: 0; width: 100%; height: 6px; background: #222; }
        .quiz-time-bar { height: 100%; width: 100%; background: #ffffff; transition: width 0.1s linear; }

        /* 5초 카운트다운 화면 오버레이 */
        .countdown-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10;
        }
        .countdown-num { font-size: 8rem; font-weight: 900; animation: popNum 0.8s ease-out; }
        @keyframes popNum { 0% { transform: scale(0.5); opacity: 0; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); } }

        /* 피드백 (정답/오답) 오버레이 */
        .feedback-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92); display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 20; opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        .feedback-screen.active { opacity: 1; visibility: visible; }
        .feedback-icon { font-size: 6rem; font-weight: 900; margin-bottom: 20px; }
        .feedback-icon.correct { color: #2ecc71; }
        .feedback-icon.wrong { color: #e74c3c; }
        .feedback-text { font-size: 2rem; font-weight: 700; color: #fff; text-align: center; line-height: 1.5; }
        .correct-answer-desc { font-size: 1.3rem; color: #aaa; margin-top: 10px; }

        /* 최종 점수 화면 */
        .result-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 30; opacity: 0; visibility: hidden; transition: opacity 0.5s ease;
        }
        .result-screen.active { opacity: 1; visibility: visible; }
        .result-title { font-size: 2.5rem; font-weight: 700; margin-bottom: 20px; }
        .result-score { font-size: 4rem; font-weight: 900; color: #2ecc71; margin-bottom: 40px; }
        .home-btn {
            background-color: #ffffff; color: #000; border: none; padding: 15px 40px;
            font-size: 1.1rem; font-weight: 700; border-radius: 30px; cursor: pointer; transition: all 0.3s; font-family: inherit;
        }
        .home-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <!-- 1. 인트로 화면 -->
    <header class="intro-section">
        <h1 class="main-title">HTTP 상태 사전</h1>
        <p class="sub-title">쉽고 재미있게 배우는 HTTP 상태 코드</p>
        <a href="#main-stage" class="scroll-down">
            Scroll Down
            <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
        </a>
    </header>

    <!-- 2. 메인 애플리케이션 화면 -->
    <main class="main-section" id="main-stage">
        <div class="bg-pattern"></div>
        <div class="content-container">
            <nav class="category-nav">
                <div class="nav-item"><button class="cat-btn active" data-filter="all">전체보기</button><div class="sub-menu" id="sub-all"></div></div>
                <div class="nav-item"><button class="cat-btn" data-filter="1xx">100족</button><div class="sub-menu" id="sub-1xx"></div></div>
                <div class="nav-item"><button class="cat-btn" data-filter="2xx">200족</button><div class="sub-menu" id="sub-2xx"></div></div>
                <div class="nav-item"><button class="cat-btn" data-filter="3xx">300족</button><div class="sub-menu" id="sub-3xx"></div></div>
                <div class="nav-item"><button class="cat-btn" data-filter="4xx">400족</button><div class="sub-menu" id="sub-4xx"></div></div>
                <div class="nav-item"><button class="cat-btn" data-filter="5xx">500족</button><div class="sub-menu" id="sub-5xx"></div></div>
            </nav>

            <div class="card-wrapper">
                <button class="nav-arrow" id="prevBtn">❮</button>
                <div class="code-card fade" id="codeCard">
                    <button class="close-btn" id="closeBtn">돌아가기</button>
                    <h2 class="code-number" id="codeNum">200</h2>
                    <div class="code-details">
                        <div class="code-en" id="codeEn">OK</div>
                        <div class="code-ko" id="codeKo">요청이 성공적으로 처리되었습니다.</div>
                    </div>
                    <div class="click-hint">클릭하여 설명보기</div>

                    <div class="extended-content">
                        <div class="anim-stage">
                            <div class="art-laptop"><div id="laptop-extras"></div></div>
                            <div class="art-track" id="anim-track"></div>
                            <div class="art-server" id="server-icon"><div id="server-extras"></div></div>
                        </div>
                        <h3 class="short-text" id="short-text">요청 정상 도달 ➔ 성공 응답 반환</h3>
                    </div>
                </div>
                <button class="nav-arrow" id="nextBtn">❯</button>
            </div>
            <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
        </div>
    </main>

    <!-- 3. 퀴즈 인트로 섹션 -->
    <section class="quiz-intro-section" id="quiz-intro">
        <h2 class="quiz-title">당신은 얼마나 기억하나요<span class="bouncing-qm">?</span></h2>
        <button class="quiz-start-btn" id="startQuizBtn">버튼을 눌러 퀴즈 시작하기</button>
    </section>

    <!-- 4. 퀴즈 실행 전체 화면 (오버레이) -->
    <div class="quiz-overlay" id="quizOverlay">
        <div class="quiz-header-index" id="quizProgressText">1/5</div>

        <div class="quiz-body">
            <div class="hint-en" id="quizHintEn"></div>
            <div class="hint-ko" id="quizHintKo"></div>
            <div class="hint-long" id="quizHintLong"></div>

            <div class="quiz-art-container dark-art" id="quizArtContainer">
                <div class="anim-stage">
                    <div class="art-laptop"><div id="q-laptop-extras"></div></div>
                    <div class="art-track" id="q-anim-track"></div>
                    <div class="art-server" id="q-server-icon"><div id="q-server-extras"></div></div>
                </div>
            </div>

            <div class="quiz-input-box">
                <input type="text" id="quizAnswerInput" placeholder="상태 코드를 입력하세요" autocomplete="off" maxlength="3">
            </div>
        </div>

        <div class="quiz-time-bar-wrapper">
            <div class="quiz-time-bar" id="quizTimeBar"></div>
        </div>

        <!-- 시작 전 5초 카운트다운 화면 -->
        <div class="countdown-screen" id="countdownScreen">
            <div class="countdown-num" id="countdownNum">5</div>
        </div>

        <!-- 정답/오답 결과 피드백 화면 -->
        <div class="feedback-screen" id="feedbackScreen">
            <div class="feedback-icon" id="feedbackIcon">✓</div>
            <div class="feedback-text" id="feedbackText">정답입니다!</div>
            <div class="correct-answer-desc" id="correctAnswerDesc"></div>
        </div>

        <!-- 최종 점수 결과 화면 -->
        <div class="result-screen" id="resultScreen">
            <div class="result-title">퀴즈 종료!</div>
            <div class="result-score" id="finalScoreText">5 / 5 개 정답</div>
            <button class="home-btn" id="goHomeBtn">메인 화면으로 돌아가기</button>
        </div>
    </div>

    <script>
        const allStatusCodes = [
            { num: "100", en: "Continue", ko: "서버가 요청의 일부를 받았으며, 나머지를 계속 보내도 됩니다.", cat: "1xx", trackHtml: `<div class="art-arrow right arr-100"></div>`, laptopHtml: ``, serverHtml: ``, serverClass: ``, shortText: "요청 일부 전송 ➔ (진행 상황 확인) ➔ 계속 전송 진행" },
            { num: "200", en: "OK", ko: "요청이 성공적으로 처리되었습니다.", cat: "2xx", trackHtml: `<div class="art-arrow right arr-200-req"></div><div class="art-arrow left arr-200-res"></div>`, laptopHtml: ``, serverHtml: ``, serverClass: ``, shortText: "요청 정상 도달 ➔ 서버 처리 완료 ➔ 성공 응답 반환" },
            { num: "201", en: "Created", ko: "새로운 리소스가 성공적으로 생성되었습니다.", cat: "2xx", trackHtml: `<div class="art-arrow right arr-201-req"></div><div class="art-arrow left arr-201-res"></div>`, laptopHtml: ``, serverHtml: `<div class="art-new-file"></div>`, serverClass: ``, shortText: "요청 정상 도달 ➔ 서버 내 새 데이터(+) 생성 ➔ 성공 반환" },
            { num: "301", en: "Moved Permanently", ko: "요청한 페이지가 새 주소로 영구 이동했습니다.", cat: "3xx", trackHtml: `<div class="art-arrow right arr-301"></div>`, laptopHtml: ``, serverHtml: `<div class="art-server-2"></div>`, serverClass: ``, shortText: "요청 도달 ➔ 기존 주소 폐기 ➔ 새 주소 서버로 영구 이동 지시" },
            { num: "304", en: "Not Modified", ko: "변경사항이 없어 캐시된 버전을 사용합니다.", cat: "3xx", trackHtml: `<div class="art-arrow right arr-304-req"></div><div class="art-arrow left arr-304-res"></div>`, laptopHtml: `<div class="art-cache">CACHE</div>`, serverHtml: ``, serverClass: ``, shortText: "서버 데이터 변경 없음 ➔ 기기(노트북)에 임시 저장된 기존 데이터 재사용" },
            { num: "400", en: "Bad Request", ko: "잘못된 문법으로 서버가 요청을 이해할 수 없습니다.", cat: "4xx", trackHtml: `<div class="art-arrow right arr-400"></div><div class="art-x-mark">X</div>`, laptopHtml: ``, serverHtml: ``, serverClass: ``, shortText: "잘못된 문법/형식의 요청 전송 ➔ 서버가 거부(차단)" },
            { num: "404", en: "Not Found", ko: "서버에서 요청한 리소스를 찾을 수 없습니다.", cat: "4xx", trackHtml: `<div class="art-arrow right arr-404-req"></div><div class="art-arrow left arr-404-res"></div>`, laptopHtml: ``, serverHtml: `<div class="art-question">?</div>`, serverClass: ``, shortText: "요청 도달 ➔ 서버 내부에 찾는 데이터가 존재하지 않음" },
            { num: "500", en: "Internal Server Error", ko: "서버 내부에 오류가 발생했습니다.", cat: "5xx", trackHtml: `<div class="art-arrow right arr-500-req"></div>`, laptopHtml: ``, serverHtml: `<div class="art-fire">!</div>`, serverClass: `art-server-500`, shortText: "요청 도달 ➔ 서버 내부 시스템 치명적 오류(버그/마비) 발생" }
        ];

        /* --- 메인 사전 카드 로직 --- */
        let currentList = [...allStatusCodes];
        let currentIndex = 0; let progress = 0; let isHovered = false; let isDetailMode = false;
        const DURATION = 5000; const INTERVAL = 50;

        const mainStage = document.getElementById('main-stage'); const codeCard = document.getElementById('codeCard');
        const codeNum = document.getElementById('codeNum'); const codeEn = document.getElementById('codeEn');
        const codeKo = document.getElementById('codeKo'); const progressBar = document.getElementById('progressBar');
        const closeBtn = document.getElementById('closeBtn'); const catBtns = document.querySelectorAll('.cat-btn');

        function createSubBtn(codeData) {
            const btn = document.createElement('button');
            btn.className = 'sub-btn'; btn.textContent = `${codeData.num} ${codeData.en}`; btn.setAttribute('data-code', codeData.num);
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const targetIndex = currentList.findIndex(c => c.num === codeData.num);
                if (targetIndex !== -1) { currentIndex = targetIndex; changeCode(0); }
            });
            return btn;
        }

        allStatusCodes.forEach(code => {
            const catSubMenu = document.getElementById(`sub-${code.cat}`);
            if (catSubMenu) catSubMenu.appendChild(createSubBtn(code));
            const allSubMenu = document.getElementById('sub-all');
            if (allSubMenu) allSubMenu.appendChild(createSubBtn(code));
        });

        codeCard.addEventListener('mouseenter', () => isHovered = true);
        codeCard.addEventListener('mouseleave', () => isHovered = false);
        codeCard.addEventListener('click', (e) => {
            if (!isDetailMode && !e.target.classList.contains('close-btn')) {
                isDetailMode = true; mainStage.classList.add('detail-mode');
            }
        });
        closeBtn.addEventListener('click', (e) => {
            e.stopPropagation(); isDetailMode = false; mainStage.classList.remove('detail-mode'); progress = 0;
        });

        function updateContent() {
            const data = currentList[currentIndex];
            codeNum.textContent = data.num; codeEn.textContent = data.en; codeKo.textContent = data.ko;
            codeCard.setAttribute('data-category', data.cat); codeCard.classList.remove('fade-out');

            document.getElementById('anim-track').innerHTML = data.trackHtml;
            document.getElementById('laptop-extras').innerHTML = data.laptopHtml;
            document.getElementById('server-extras').innerHTML = data.serverHtml;
            document.getElementById('server-icon').className = `art-server ${data.serverClass}`;
            document.getElementById('short-text').textContent = data.shortText;

            document.querySelectorAll('.sub-btn').forEach(btn => btn.classList.remove('selected'));
            document.querySelectorAll(`.sub-btn[data-code="${data.num}"]`).forEach(btn => btn.classList.add('selected'));
        }

        function changeCode(direction) {
            codeCard.classList.add('fade-out'); progress = 0; progressBar.style.width = '0%';
            setTimeout(() => { currentIndex = (currentIndex + direction + currentList.length) % currentList.length; updateContent(); }, 300);
        }

        catBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                catBtns.forEach(b => b.classList.remove('active')); e.target.classList.add('active');
                const filter = e.target.getAttribute('data-filter');
                currentList = filter === 'all' ? [...allStatusCodes] : allStatusCodes.filter(code => code.cat === filter);
                currentIndex = 0; changeCode(0);
            });
        });

        document.getElementById('prevBtn').addEventListener('click', () => changeCode(-1));
        document.getElementById('nextBtn').addEventListener('click', () => changeCode(1));

        setInterval(() => {
            if (!isHovered && !isDetailMode) {
                progress += (INTERVAL / DURATION) * 100; progressBar.style.width = `${progress}%`; progressBar.style.opacity = "1";
                if (progress >= 100) { changeCode(1); }
            } else if (isHovered && !isDetailMode) { progressBar.style.opacity = "0.3"; }
        }, INTERVAL);
        updateContent();


        /* =========================================
           5단계 퀴즈 시스템 전체 구현
           ========================================= */
        const quizOverlay = document.getElementById('quizOverlay');
        const startQuizBtn = document.getElementById('startQuizBtn');
        const quizProgressText = document.getElementById('quizProgressText');
        
        const quizHintEn = document.getElementById('quizHintEn');
        const quizHintKo = document.getElementById('quizHintKo');
        const quizHintLong = document.getElementById('quizHintLong');
        const quizArtContainer = document.getElementById('quizArtContainer');
        const quizAnswerInput = document.getElementById('quizAnswerInput');
        const quizTimeBar = document.getElementById('quizTimeBar');

        const countdownScreen = document.getElementById('countdownScreen');
        const countdownNum = document.getElementById('countdownNum');

        const feedbackScreen = document.getElementById('feedbackScreen');
        const feedbackIcon = document.getElementById('feedbackIcon');
        const feedbackText = document.getElementById('feedbackText');
        const correctAnswerDesc = document.getElementById('correctAnswerDesc');

        const resultScreen = document.getElementById('resultScreen');
        const finalScoreText = document.getElementById('finalScoreText');
        const goHomeBtn = document.getElementById('goHomeBtn');

        let quizQuestions = [];
        let currentQuizIndex = 0;
        let score = 0;

        let countdownTimer = null;
        let mainTimer = null;
        let hintTimeouts = [];
        let isAnsweringAllowed = false;

        // 배열 셔플 함수
        function shuffleArray(arr) {
            return [...arr].sort(() => Math.random() - 0.5);
        }

        // 퀴즈 시작 초기화
        startQuizBtn.addEventListener('click', () => {
            quizQuestions = shuffleArray(allStatusCodes).slice(0, 5); // 5개 랜덤 추출
            currentQuizIndex = 0;
            score = 0;
            
            resultScreen.classList.remove('active');
            quizOverlay.classList.add('active');
            
            prepareQuestion();
        });

        // 타이머 및 애니메이션 완전 초기화
        function clearAllQuizTimers() {
            clearInterval(countdownTimer);
            clearInterval(mainTimer);
            hintTimeouts.forEach(t => clearTimeout(t));
            hintTimeouts = [];
        }

        // 문제 준비 (5초 카운트다운 시작)
        function prepareQuestion() {
            clearAllQuizTimers();
            isAnsweringAllowed = false;

            const qNum = currentQuizIndex + 1;
            quizProgressText.textContent = `${qNum}/5`;

            // UI 힌트 초기화
            quizHintEn.classList.remove('hint-show');
            quizHintKo.classList.remove('hint-show');
            quizHintLong.classList.remove('hint-show');
            quizArtContainer.classList.remove('hint-show');
            
            quizAnswerInput.value = '';
            quizAnswerInput.disabled = true;
            quizTimeBar.style.width = '100%';

            feedbackScreen.classList.remove('active');
            countdownScreen.style.display = 'flex';

            // 5초 카운트다운
           let count = (currentQuizIndex === 0) ? 5 : 2;
	   countdownNum.textContent = count; 
           
            countdownTimer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownNum.textContent = count;
                    countdownNum.style.animation = 'none';
                    void countdownNum.offsetWidth; // 리플로우
                    countdownNum.style.animation = 'popNum 0.8s ease-out';
                } else {
                    clearInterval(countdownTimer);
                    countdownScreen.style.display = 'none';
                    startQuestionTimer();
                }
            }, 1000);
        }

        // 문제 30초 시간 카운트다운 & 시간대별 힌트 출력
        function startQuestionTimer() {
            const currentData = quizQuestions[currentQuizIndex];
            isAnsweringAllowed = true;
            quizAnswerInput.disabled = false;
            quizAnswerInput.focus();

            // 0초: 영명 표시
            quizHintEn.textContent = currentData.en;
            quizHintEn.classList.add('hint-show');

            // 5초: 한국어 간단 설명 표시
            hintTimeouts.push(setTimeout(() => {
                quizHintKo.textContent = currentData.ko;
                quizHintKo.classList.add('hint-show');
            }, 5000));

            // 10초: 한국어 긴 설명 (카드 아래 문구) 표시
            hintTimeouts.push(setTimeout(() => {
                quizHintLong.textContent = currentData.shortText;
                quizHintLong.classList.add('hint-show');
            }, 10000));

            // 23초: 그림 애니메이션 노출 (하얀색 다크모드 전용)
            hintTimeouts.push(setTimeout(() => {
                document.getElementById('q-anim-track').innerHTML = currentData.trackHtml;
                document.getElementById('q-laptop-extras').innerHTML = currentData.laptopHtml;
                document.getElementById('q-server-extras').innerHTML = currentData.serverHtml;
                document.getElementById('q-server-icon').className = `art-server ${currentData.serverClass}`;
                
                quizArtContainer.classList.add('hint-show');
            }, 23000));

            // 30초 줄어드는 흰색 타임바 (100ms마다 감소)
            let remainingMs = 30000;
            const step = 100;

            mainTimer = setInterval(() => {
                remainingMs -= step;
                const percent = Math.max(0, (remainingMs / 30000) * 100);
                quizTimeBar.style.width = `${percent}%`;

                if (remainingMs <= 0) {
                    clearAllQuizTimers();
                    handleAnswerSubmit(null); // 시간초과 (오답)
                }
            }, step);
        }

        // 정답 제출 이벤트 (Enter키)
        quizAnswerInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && isAnsweringAllowed) {
                const userVal = quizAnswerInput.value.trim();
                if (userVal !== "") {
                    clearAllQuizTimers();
                    handleAnswerSubmit(userVal);
                }
            }
        });

        // 정답/오답 판정
        function handleAnswerSubmit(userAns) {
            isAnsweringAllowed = false;
            quizAnswerInput.disabled = true;

            const currentData = quizQuestions[currentQuizIndex];
            const isCorrect = (userAns === currentData.num);

            if (isCorrect) {
                score++;
                feedbackIcon.textContent = '✓';
                feedbackIcon.className = 'feedback-icon correct';
                feedbackText.textContent = '정답입니다!';
                correctAnswerDesc.textContent = '';
            } else {
                feedbackIcon.textContent = '✕';
                feedbackIcon.className = 'feedback-icon wrong';
                feedbackText.textContent = '오답입니다!';
                correctAnswerDesc.textContent = `정답: ${currentData.num} (${currentData.en})`;
            }

            feedbackScreen.classList.add('active');

            // 2초 뒤 다음 문제 또는 결과 화면
            setTimeout(() => {
                currentQuizIndex++;
                if (currentQuizIndex < 5) {
                    prepareQuestion();
                } else {
                    showFinalResult();
                }
            }, 2000);
        }

        // 최종 점수 및 완료 화면
        function showFinalResult() {
            feedbackScreen.classList.remove('active');
            finalScoreText.textContent = `총 5문제 중 ${score}개 정답!`;
            resultScreen.classList.add('active');
        }

        // 메인 화면으로 돌아가기 버튼
        goHomeBtn.addEventListener('click', () => {
            quizOverlay.classList.remove('active');
            // 메인 페이지로 이동
            window.location.hash = "#main-stage";
        });
    </script>
</body>
</html>
